<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta
      name="description"
      content="NAFSI AI - Premium Moroccan AI companion demo"
    />
    <title>NAFSI AI</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d0d0f'/%3E%3Cpath d='M20 46h24v-4H20zm4-26h16v20H24zm8-8c-8 0-14 5.8-14 13.1 0 6.7 4.7 11.7 11 12.8V46h6v-6.1c6.3-1.1 11-6.1 11-12.8C46 17.8 40 12 32 12zm0 8a5 5 0 110 0 5 5 0 01-10 0zm0 12.5c-4 0-7.4-2.6-8.3-6.2.8-.7 2.1-1.3 4.2-1.3 2.4 0 3.5 1 4.1 1.6.7.7 1.6 1.1 2.8 1.1 1.8 0 3.2-.6 4.2-1.3-.9 3.6-4.3 6.2-8.1 6.2z' fill='%23d4af37'/%3E%3C/svg%3E" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">N</div>
          <div>
            <p class="eyebrow">Moroccan companion</p>
            <h1>NAFSI AI</h1>
          </div>
        </div>
        <button id="installBtn" class="install-btn hidden" type="button">
          Install app
        </button>
      </header>

      <main class="mobile-frame">
        <section class="status-panel">
          <div class="status-badge">Demo mode</div>
          <div class="status-meta">
            <span>Free browser voice</span>
            <span>Darija • Arabic • French</span>
          </div>
        </section>

        <section id="chat" class="chat-panel" aria-live="polite"></section>

        <form id="composer" class="composer">
          <button id="voiceInputBtn" class="icon-btn" type="button" aria-label="Use microphone">
            🎙️
          </button>
          <textarea
            id="messageInput"
            rows="1"
            placeholder="Ecrivez votre message en Darija..."
            aria-label="Message input"
          ></textarea>
          <button class="send-btn" type="submit">Send</button>
        </form>

        <div class="settings-panel">
          <div class="setting-row">
            <label for="voiceSelect">Voix</label>
            <select id="voiceSelect"></select>
          </div>
          <div class="setting-row split">
            <label for="rateRange">Vitesse</label>
            <input id="rateRange" type="range" min="0.7" max="1.4" step="0.1" value="1" />
          </div>
          <div class="setting-row split">
            <label for="pitchRange">Ton</label>
            <input id="pitchRange" type="range" min="0.8" max="1.8" step="0.1" value="1" />
          </div>
          <div class="toolbar">
            <button id="speakBtn" class="secondary-btn" type="button">Lire la réponse</button>
            <button id="clearHistoryBtn" class="secondary-btn danger" type="button">Effacer l’historique</button>
          </div>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
